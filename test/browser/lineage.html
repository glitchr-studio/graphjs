<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>graphjs - the lit line</title>
    <link rel="stylesheet" href="../../src/css/index.css">
</head>
<body>
    <div id="graph" data-graph data-graph-lineage="off"></div>
    <pre id="result">pending</pre>
    <script type="module">
        import { Graph } from '../../src/js/graph.js';
        const lines = [];
        const check = (ok, text) => lines.push((ok ? 'ok ' : 'FAIL ') + text);
        // a -> b -> c, d -> c, and c -> a closing a cycle: the layout sets c -> a aside
        const graph = new Graph(document.getElementById('graph'));
        graph.setData({
            nodes: [{ id: 'a' }, { id: 'b' }, { id: 'c' }, { id: 'd' }],
            edges: [{ from: 'a', to: 'b' }, { from: 'b', to: 'c' }, { from: 'd', to: 'c' }, { from: 'c', to: 'a' }],
        });
        check(graph.result.ignored.length === 1 && graph.result.ignored[0].reason === 'cycle', 'the cycle edge is set aside');
        const lit = () => Array.from(graph.elements).filter(([, el]) => el.classList.contains('is-lineage')).map(([id]) => id).sort().join(' ');
        const litEdges = () => graph.paths.filter((p) => p.element.classList.contains('is-lineage')).map((p) => p.from + '>' + p.to).sort().join(' ');
        graph.highlight('d');
        check(lit() === 'c d', 'd lights c and d only (' + lit() + ')');
        check(litEdges() === 'd>c', 'd lights its drawn edge only (' + litEdges() + ')');
        graph.highlight('a');
        check(lit() === 'a b c', 'a lights a, b, c (' + lit() + ')');
        check(litEdges() === 'a>b b>c', 'a lights a>b and b>c (' + litEdges() + ')');
        graph.highlight('c');
        check(lit() === 'a b c d', 'c lights its ancestors (' + lit() + ')');
        graph.highlight(null);
        check(lit() === '' && !graph.root.classList.contains('has-lineage'), 'highlight(null) puts it out');
        document.getElementById('result').textContent = lines.join('\n');
    </script>
</body>
</html>
